[project]
name = "ai-factory-optical-twin"
version = "0.1.0"
description = "Digital twin for AI-factory optical interconnect reliability and economics."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["optical_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
